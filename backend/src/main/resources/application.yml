server:
  port: 8080

spring:
  application:
    name: backend
  ai:
    openai:
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      api-key: ${GEMINI_API_KEY}
      chat:
        options:
          model: ${AI_EXTRACTION_MODEL:gemini-flash-latest}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:gemini-embedding-001}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 300000
      connection-timeout: 30000
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:hoangquangnghia123@gmail.com}
    password: ${MAIL_PASSWORD:aaaa aaaa aaaa}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 6000

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

ai:
  extraction:
    active-provider: ${AI_EXTRACTION_PROVIDER:gemini}
    model: ${AI_EXTRACTION_MODEL:gemini-flash-latest}
    prompt-version: ${AI_EXTRACTION_PROMPT_VERSION:cv_extract_v3}
    fallback-model: ${AI_EXTRACTION_FALLBACK_MODEL:gemini-flash-lite-latest}
    temperature: ${AI_EXTRACTION_TEMPERATURE:0.1}
    max-tokens: ${AI_EXTRACTION_MAX_TOKENS:4096}
    retries: ${AI_EXTRACTION_RETRIES:2}
    timeout-ms: ${AI_EXTRACTION_TIMEOUT_MS:20000}
  embedding:
    active-provider: ${AI_EMBEDDING_PROVIDER:gemini}
    model: ${AI_EMBEDDING_MODEL:gemini-embedding-001}
    dimensions: ${AI_EMBEDDING_DIMENSIONS:768}
    batch-size: ${AI_EMBEDDING_BATCH_SIZE:1}
    chunk-token-size: ${AI_EMBEDDING_CHUNK_TOKEN_SIZE:500}
    chunk-token-overlap: ${AI_EMBEDDING_CHUNK_TOKEN_OVERLAP:50}
    retries: ${AI_EMBEDDING_RETRIES:2}
    timeout-ms: ${AI_EMBEDDING_TIMEOUT_MS:20000}
    max-characters-per-input: ${AI_EMBEDDING_MAX_CHARACTERS_PER_INPUT:8000}
  prompts:
    active-version: ${AI_PROMPT_VERSION:cv_extract_v3}

matching:
  hybrid:
    version: ${MATCHING_HYBRID_VERSION:default}
    candidate-pool-size: ${MATCHING_HYBRID_POOL_SIZE:50}
    max-limit: ${MATCHING_HYBRID_MAX_LIMIT:50}
    required-skill-weight: ${MATCHING_HYBRID_REQUIRED_SKILL_WEIGHT:0.7}
    preferred-skill-weight: ${MATCHING_HYBRID_PREFERRED_SKILL_WEIGHT:0.3}
    weights:
      semantic: ${MATCHING_HYBRID_WEIGHT_SEMANTIC:0.6}
      fts: ${MATCHING_HYBRID_WEIGHT_FTS:0.25}
      skills: ${MATCHING_HYBRID_WEIGHT_SKILLS:0.15}


jwt:
  signerKey: ${SIGNER_KEY}
  valid-duration: 3600 #seconds
  refreshable-duration: 36000 #seconds

auth:
  reset-token-ttl-minutes: ${AUTH_RESET_TOKEN_TTL_MINUTES:15}
  otp-resend-cooldown-seconds: ${AUTH_OTP_RESEND_COOLDOWN_SECONDS:60}

supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  bucket: ${SUPABASE_BUCKET:cv_upload}
  signed-url-ttl-seconds: ${SUPABASE_SIGNED_URL_TTL_SECONDS:7200}

notification:
  locale: ${NOTIFICATION_LOCALE:vi}
  from-address: ${NOTIFICATION_FROM_ADDRESS:hoangquangnghia123@gmail.com}
  from-name: ${NOTIFICATION_FROM_NAME:Recruitment Curator}
  max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:3}
  otp-ttl-minutes: ${NOTIFICATION_OTP_TTL_MINUTES:5}
  outbox-batch-size: ${NOTIFICATION_OUTBOX_BATCH_SIZE:50}
  send-batch-size: ${NOTIFICATION_SEND_BATCH_SIZE:50}
  outbox-dispatch-interval-ms: ${NOTIFICATION_OUTBOX_DISPATCH_INTERVAL_MS:3000}
  worker-interval-ms: ${NOTIFICATION_WORKER_INTERVAL_MS:5000}
  mail:
    smtp-enabled: ${NOTIFICATION_SMTP_ENABLED:true}
    provider: ${NOTIFICATION_MAIL_PROVIDER:logging}
